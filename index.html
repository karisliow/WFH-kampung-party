<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kampong Party 🎲</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#352c29;background:#fff7e8}*{box-sizing:border-box}body{margin:0;padding:18px}.wrap{max-width:720px;margin:auto}header{text-align:center;padding:12px}h1{margin:4px;font-size:2rem}h2{font-size:1.15rem}.card{background:#fff;border:2px solid #eedcc1;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 5px 0 #efdfc8}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{font:inherit;font-size:1rem;padding:12px;border-radius:12px}input,select{border:2px solid #d9c7a9;width:100%;background:#fff}button{border:0;background:#267968;color:white;font-weight:700;cursor:pointer;min-height:48px}button:disabled{opacity:.5;cursor:not-allowed}.secondary{background:#9a6c45}.buttons{display:flex;gap:10px;flex-wrap:wrap}.buttons button{flex:1}.muted{color:#72645b}.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}.tile{position:relative;min-height:85px;border-radius:10px;border:2px solid #e9d6b7;background:#f9edcf;padding:5px;font-size:.8rem}.tile:nth-child(3n){background:#e1f2e5}.tile:nth-child(4n){background:#e5ecfb}.num{font-weight:800}.tokens{display:flex;flex-wrap:wrap;gap:1px;font-size:1.4rem;line-height:1.2}.feature{font-size:.8rem}.status{padding:12px;background:#e7f5ed;border-radius:12px}.player{padding:8px 10px;border-radius:9px;background:#f4eee2;margin:6px 0}.active{outline:3px solid #e5b54d}.hidden{display:none}.celebrate{text-align:center;font-size:1.5rem;animation:bounce .6s infinite alternate}@keyframes bounce{to{transform:translateY(-7px)}}.small{font-size:.85rem}#error{color:#a32828;font-weight:700;white-space:pre-wrap} .tile.finish{background:#ffe4a5}@media(max-width:450px){body{padding:9px}.card{padding:12px}.tile{min-height:72px;padding:3px}.tokens{font-size:1.1rem}}
</style></head><body><main class="wrap"><header><h1>🏮 Kampong Party</h1><div class="muted">Singapore Heritage Snakes & Ladders · Multiplayer Prototype</div></header><div id="error" role="alert"></div>
<section class="card" id="setup"><h2>Join the adventure!</h2><label>Your nickname</label><input id="nickname" maxlength="20" placeholder="e.g. Ah Mei"><label>Choose your character</label><select id="character"><option value="merlion">🦁 Merlion</option><option value="rickshaw">🛺 Rickshaw</option><option value="bus">🚌 SBS Bus</option><option value="dragon">🐉 Dragon Playground</option></select><div class="buttons" style="margin-top:16px"><button id="create">Create room</button></div><label>Or enter a 6-digit room code</label><input id="code" maxlength="6" inputmode="numeric" placeholder="123456"><div class="buttons"><button class="secondary" id="join">Join room</button></div><p class="muted small">Each person uses their own phone. Maximum four players.</p></section>
<section id="game" class="hidden"><div class="card"><h2>Room <span id="roomCode"></span></h2><p class="status" id="status">Connecting…</p><div id="players"></div><div class="buttons"><button id="start" class="hidden">Start game</button><button id="roll" class="hidden">🎲 Roll dice</button></div><p id="lastRoll" class="muted"></p><div id="winner" class="celebrate"></div></div><div class="card"><h2>Race to Square 15 🏁</h2><div class="board" id="board"></div><p class="muted small">🪜 Ladders: 3→7, 8→12 · 🐍 Snakes: 11→6, 14→9</p></div></section><p class="muted small" style="text-align:center">Prototype v1 · No coins, shops or mini-games yet</p></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// REPLACE BOTH VALUES with your Supabase Project URL and publishable key.
const SUPABASE_URL = 'https://ciuuigjkqqrzrkcpputj.supabase.co';
const SUPABASE_KEY = 'sb_publishable_4-t4_rb18IBRa9nXeS97HA_YwR_kcOQ';
const $=id=>document.getElementById(id), icons={merlion:'🦁',rickshaw:'🛺',bus:'🚌',dragon:'🐉'};
let db,me,roomCode='',room=null,players=[],channel=null,lastMessage='';
const error=e=>{$('error').textContent=e?.message||String(e);};
const clearError=()=>{$('error').textContent='';};
const friendly=async(promise)=>{const {data,error:err}=await promise;if(err)throw err;return data;};
async function init(){try{if(SUPABASE_URL.includes('YOUR-PROJECT')||SUPABASE_KEY.includes('YOUR-PUBLISHABLE'))throw Error('First, add your Supabase URL and publishable key in index.html.');db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let {data:{session}}=await db.auth.getSession();if(!session){const out=await db.auth.signInAnonymously();if(out.error)throw out.error;session=out.data.session;}me=session.user.id;const saved=sessionStorage.getItem('kp_room');if(saved){roomCode=saved;$('setup').classList.add('hidden');$('game').classList.remove('hidden');await refresh();subscribe();}}catch(e){error(e);}}
async function create(){try{clearError();const name=$('nickname').value.trim();if(!name)throw Error('Enter a nickname first.');roomCode=await friendly(db.rpc('kp_create_room',{p_nickname:name,p_character:$('character').value}));enter();}catch(e){error(e);}}
async function join(){try{clearError();const name=$('nickname').value.trim(),code=$('code').value.trim();if(!name||!/^[0-9]{6}$/.test(code))throw Error('Enter a nickname and a 6-digit room code.');await friendly(db.rpc('kp_join_room',{p_code:code,p_nickname:name,p_character:$('character').value}));roomCode=code;enter();}catch(e){error(e);}}
async function enter(){sessionStorage.setItem('kp_room',roomCode);$('setup').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=roomCode;await refresh();subscribe();}
async function refresh(){if(!db||!roomCode)return;try{room=await friendly(db.from('kp_rooms').select('*').eq('code',roomCode).single());players=await friendly(db.from('kp_players').select('*').eq('room_id',room.id).order('joined_at').order('id'));render();}catch(e){error(e);}}
function render(){if(!room)return;$('roomCode').textContent=roomCode;const current=players.find(p=>p.id===room.turn_player_id),winner=players.find(p=>p.id===room.winner_id);$('status').textContent=room.status==='waiting'?`Waiting for players (${players.length}/4). Host can start with 2 or more.`:room.status==='playing'?`It's ${current?.nickname||'someone'}'s turn!`:'Game finished!';$('players').replaceChildren();players.forEach(p=>{const div=document.createElement('div');div.className='player'+(p.id===room.turn_player_id?' active':'');div.textContent=`${icons[p.character]} ${p.nickname} · Square ${p.position}${p.user_id===me?' (You)':''}`;$('players').append(div);});$('start').classList.toggle('hidden',!(room.status==='waiting'&&room.host_id===me));$('start').disabled=players.length<2;$('roll').classList.toggle('hidden',!(room.status==='playing'&&current?.user_id===me));$('winner').textContent=winner?`🎉 ${icons[winner.character]} ${winner.nickname} wins! 🎊`:'';drawBoard();}
function drawBoard(){const board=$('board');board.replaceChildren();for(let row=2;row>=0;row--){const nums=Array.from({length:5},(_,i)=>row*5+i+1);if(row%2===1)nums.reverse();for(const n of nums){const tile=document.createElement('div');tile.className='tile'+(n===15?' finish':'');const num=document.createElement('div');num.className='num';num.textContent=n;tile.append(num);const feature=document.createElement('div');feature.className='feature';feature.textContent=({3:'🪜 →7',8:'🪜 →12',11:'🐍 →6',14:'🐍 →9',15:'🏁 FINISH'})[n]||'';tile.append(feature);const tokens=document.createElement('div');tokens.className='tokens';tokens.textContent=players.filter(p=>p.position===n).map(p=>icons[p.character]).join('');tile.append(tokens);board.append(tile);}}}
function subscribe(){if(channel)db.removeChannel(channel);channel=db.channel('kp-'+roomCode).on('postgres_changes',{event:'*',schema:'public',table:'kp_rooms'},refresh).on('postgres_changes',{event:'*',schema:'public',table:'kp_players'},refresh).subscribe();}
async function start(){try{clearError();await friendly(db.rpc('kp_start_game',{p_code:roomCode}));await refresh();}catch(e){error(e);}}
async function roll(){try{clearError();$('roll').disabled=true;const result=await friendly(db.rpc('kp_roll',{p_code:roomCode}));$('lastRoll').textContent=`${result.player} rolled ${result.roll}: square ${result.from} → ${result.to}`;await refresh();}catch(e){error(e);}finally{$('roll').disabled=false;}}
$('create').onclick=create;$('join').onclick=join;$('start').onclick=start;$('roll').onclick=roll;init();setInterval(()=>{if(roomCode)refresh();},2500);
</script></body></html>
